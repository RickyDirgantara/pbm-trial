name: Test and deploy

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      vps-configured: ${{ steps.vps.outputs.configured }}
    steps:
      - uses: actions/checkout@v4
      # Projects hosted elsewhere (e.g. Vercel) leave the VPS secrets unset;
      # the deploy job below is skipped rather than failing on every push.
      - id: vps
        run: echo "configured=${{ secrets.VPS_HOST != '' }}" >> "$GITHUB_OUTPUT"
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22.14'
          cache: npm
      - run: composer install --no-interaction --prefer-dist
      - run: npm ci
      - run: cp .env.example .env && php artisan key:generate
      - run: composer validate --strict
      - run: composer ci:check
      - run: npm run build
      # Written outside the workspace: an archive created inside the directory
      # it is reading makes tar exit 1 with "file changed as we read it".
      - run: tar --exclude=.git --exclude=.env --exclude=node_modules --exclude=vendor --exclude=storage/logs -czf "${RUNNER_TEMP}/release.tar.gz" .
      - uses: actions/upload-artifact@v4
        with:
          name: release
          path: ${{ runner.temp }}/release.tar.gz

  deploy:
    needs: build
    if: needs.build.outputs.vps-configured == 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release
      - uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          port: ${{ secrets.VPS_PORT }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: release.tar.gz
          target: /tmp/pbm-lp-deploy
      - uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          port: ${{ secrets.VPS_PORT }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd "${{ secrets.VPS_PROJECT_PATH }}"
            php artisan down || true
            tar -xzf /tmp/pbm-lp-deploy/release.tar.gz
            composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader
            php artisan migrate --force
            php artisan optimize
            php artisan up
